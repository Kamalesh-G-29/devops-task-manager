name: DevOps Task Manager CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Wait for MongoDB
        run: |
          echo "Waiting for MongoDB..."
          for i in {1..30}; do
            if timeout 2 bash -c 'echo > /dev/tcp/127.0.0.1/27017' 2>/dev/null; then
              echo "MongoDB is ready!"
              exit 0
            fi
            echo "MongoDB not ready yet. Attempt $i/30"
            sleep 2
          done
          echo "MongoDB did not become ready."
          docker ps -a
          exit 1

      - name: Start Backend
        working-directory: backend
        env:
          PORT: 5000
          MONGO_URI: mongodb://127.0.0.1:27017/devops_task_manager
          JWT_SECRET: test_secret_for_ci_only
        run: |
          nohup npm start > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for Backend
        run: |
          echo "Waiting for backend..."
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5000/api/health; then
              echo "Backend is ready!"
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed to start. Logs:"
          cat backend/server.log
          exit 1

      - name: Run Backend Tests
        working-directory: backend
        env:
          PORT: 5000
          MONGO_URI: mongodb://127.0.0.1:27017/devops_task_manager
          JWT_SECRET: test_secret_for_ci_only
        run: npm test

      - name: Display Backend Logs
        if: failure()
        run: |
          if [ -f backend/server.log ]; then
            cat backend/server.log
          fi

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      - name: Backend ESLint
        working-directory: backend
        run: npm run lint

      - name: Frontend ESLint
        working-directory: frontend
        run: npm run lint

