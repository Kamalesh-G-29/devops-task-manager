
services:
  mongodb:
    image: mongo:8
    container_name: devops-compose-mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: devops-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/devops_task_manager
      JWT_SECRET: devops_compose_change_this_secret
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: devops-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongo_data:
